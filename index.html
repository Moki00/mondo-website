<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mondo | Official Website</title>
    <meta
      name="description"
      content="Official website for Mondo. Stream latest tracks, watch videos, and view the press kit."
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/script.js"></script>
  </head>
  <body>
    <!-- Navigation -->
    <header class="site-header">
      <a href="index.html" class="site-logo">MONDO</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="music.html">Music</a>
        <a href="videos.html">Videos</a>
        <a href="bio.html">Bio</a>
        <a href="booking.html">Booking</a>
      </nav>
    </header>

    <!-- Hero Section -->
    <section id="hero" class="hero-section">
      <div class="hero-content">
        <span class="hero-tag">Official Release</span>
        <h1 class="hero-title">NEW HEAT OUT NOW</h1>
        <p class="hero-desc">
          Stream the newest project directly, watch official music videos, and
          view upcoming dates.
        </p>
        <div class="hero-actions">
          <a href="#music" class="btn-primary">Listen Now</a>
          <a href="/videos.html" class="btn-secondary">Watch Videos</a>
        </div>
      </div>
      <div class="hero-media">
        <img
          src="assets/pics/mSide.jpeg"
          alt="Mondo"
          loading="lazy"
          decoding="async"
          class="hero-image"
        />
      </div>
    </section>

    <!-- Single-Track Vanilla Audio Preview -->
    <section id="music" class="audio-section">
      <div class="audio-container">
        <h2 class="section-title">FEATURED STREAM</h2>
        <p class="track-title">Bad Lil Chica</p>

        <audio
          controls
          controlsList="nodownload"
          oncontextmenu="return false;"
          preload="metadata"
          class="audio-player"
        >
          <source src="assets/audio/Bad_Lil_Chica.mp3" type="audio/mpeg" />
          <source src="assets/audio/Bad_Lil_Chica.wav" type="audio/wav" />
          Your browser does not support the audio element.
        </audio>

        <p class="audio-description">
          Preview the latest track "Bad Lil Chica" by Mondo.
        </p>
      </div>
    </section>

    <script src="assets/js/app.js"></script>
  </body>
</html>
